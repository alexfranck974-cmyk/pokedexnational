name: Sync JP/CN TCG card prices

on:
  schedule:
    # Every Monday at 06:00 UTC — an hour after the global price sync
    # (sync-tcg-prices.yml), same weekly cadence. Previously JP/CN prices only
    # refreshed via the monthly full metadata sync (sync-tcgdex-cards.yml),
    # which could leave a fast-moving card up to a month stale.
    - cron: '0 6 * * 1'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run sync:tcgdex:prices
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
