name: Sync TCGdex JP/CN cards

on:
  schedule:
    # 1st of each month at 06:00 UTC — new JP/CN sets release far less often than
    # cardmarket prices update, no point running weekly like the price sync.
    - cron: '0 6 1 * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync-tcgdex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # sync:tcgdex chains the TCGPlayer image backfill (sync:tcgplayer-images)
      # after the raw TCGdex crawl itself — the crawl blindly re-writes the
      # sprite fallback for gap-fill sets every run (it doesn't know about the
      # backfill), so the two must never run one without the other. That's
      # enforced in package.json now, not just here — see 2026-08-24 incident:
      # a manual sync:tcgdex-only run (back when the two were separate npm
      # scripts) wiped mep + several JP sets' real card art back to sprite
      # placeholders for two days with nothing to catch it.
      - run: npm run sync:tcgdex
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Tripwire for everything the chaining above can't catch by construction
      # (a future refactor that breaks it, tcgcsv.com/TCGdex changing shape so
      # the backfill silently matches nothing) — fails the workflow loudly
      # instead of a green checkmark hiding a quiet image regression.
      - run: npm run check:image-fallback
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
